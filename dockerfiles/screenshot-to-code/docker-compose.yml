services:
  backend:
    build:
      context: ../../apps/screenshot-to-code/backend
      dockerfile: ../../../dockerfiles/screenshot-to-code/backend/Dockerfile
    image: hoomzoom/screenshot-to-code-backend:latest
    ports:
      - "${BACKEND_PORT:-7001}:7001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - BACKEND_PORT=7001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7001/docs')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - s2c-net

  frontend:
    build:
      context: ../../apps/screenshot-to-code/frontend
      dockerfile: ../../../dockerfiles/screenshot-to-code/frontend/Dockerfile
    image: hoomzoom/screenshot-to-code-frontend:latest
    ports:
      - "5173:5173"
    environment:
      - VITE_WS_BACKEND_URL=ws://localhost:${BACKEND_PORT:-7001}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.request({host:'localhost',port:5173,path:'/'}, (res) => { process.exit(res.statusCode < 500 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.end();"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - s2c-net

networks:
  s2c-net:
    external: false
