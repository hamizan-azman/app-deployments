services:
  # LiteLLM Proxy — LLM API Gateway
  # Handles model routing, authentication, and usage tracking.
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.82.3-stable.patch.2
    container_name: decepticon-litellm
    volumes:
      - ../../apps/Decepticon/config/litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    env_file: .env
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - DATABASE_URL=postgresql://decepticon:${POSTGRES_PASSWORD}@postgres:5432/litellm
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - decepticon-net
    restart: unless-stopped

  # PostgreSQL — Persistent storage for LiteLLM
  # Stores virtual keys, spend logs, user budgets, and rate limits.
  postgres:
    image: postgres:17-alpine
    container_name: decepticon-postgres
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: decepticon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - decepticon-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decepticon -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Sandbox — Isolated Kali Linux container for red-team tool execution
  # Runs on sandbox-net only. No access to litellm, postgres, or langgraph.
  # LangGraph reaches the sandbox via docker exec (Docker socket), not the network.
  sandbox:
    image: ghcr.io/purpleailab/decepticon-sandbox:${DECEPTICON_VERSION:-latest}
    container_name: decepticon-sandbox
    networks:
      - sandbox-net
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    volumes:
      - ${DECEPTICON_HOME:-~/.decepticon}/workspace:/workspace
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 1024
    restart: unless-stopped

  # LangGraph Platform — Agent API Server
  # Exposes all agents as a streaming API on port 2024.
  # The Ink CLI connects here.
  langgraph:
    image: ghcr.io/purpleailab/decepticon-langgraph:${DECEPTICON_VERSION:-latest}
    container_name: decepticon-langgraph
    ports:
      - "${LANGGRAPH_PORT:-2024}:2024"
    env_file: .env
    environment:
      - DECEPTICON_LLM__PROXY_URL=http://litellm:4000
      - DECEPTICON_LLM__PROXY_API_KEY=${LITELLM_MASTER_KEY}
      - DECEPTICON_DOCKER__SANDBOX_CONTAINER_NAME=decepticon-sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      litellm:
        condition: service_healthy
      sandbox:
        condition: service_started
    networks:
      - decepticon-net
    restart: unless-stopped

  # Ink CLI — Interactive terminal UI
  # Not started by default. Run with: docker compose run --rm cli
  cli:
    image: ghcr.io/purpleailab/decepticon-cli:${DECEPTICON_VERSION:-latest}
    container_name: decepticon-cli
    stdin_open: true
    tty: true
    environment:
      - DECEPTICON_API_URL=http://langgraph:2024
      - TERM=xterm-256color
      - COLORTERM=truecolor
    depends_on:
      langgraph:
        condition: service_started
    networks:
      - decepticon-net
    profiles:
      - cli

  # C2 Sliver — Command and control server (profile-based, default active)
  # Runs on sandbox-net only. Activate by including c2-sliver in COMPOSE_PROFILES.
  c2-sliver:
    image: ghcr.io/purpleailab/decepticon-c2-sliver:${DECEPTICON_VERSION:-latest}
    container_name: decepticon-c2-sliver
    networks:
      - sandbox-net
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - sliver_data:/home/sliver/.sliver
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 512
    restart: unless-stopped
    profiles:
      - c2-sliver

volumes:
  postgres_data:
  sliver_data:

networks:
  decepticon-net:
    driver: bridge
  sandbox-net:
    driver: bridge
